name: Deploy BE App

on:
  push:
    branches: ["main", "develop"]

env:
  CHART_DIR: ./helm
  RELEASE_NAME: mediflow
  NAMESPACE: mediflow
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  VERSION_TAG: ${{ github.sha }}

jobs:
  notify-start:
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.set-start-time.outputs.start_time }}
    steps:
      - name: Set start time
        id: set-start-time
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Send Discord notification - Workflow started
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"🚀 **mediflow » mediflow-be - #${{ github.run_number }}** Started by \`${{ github.actor }}\` ([view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Build and start Docker Compose
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.override.yml up -d

      - name: Run tests
        run: dotnet test MediFlow.sln --configuration Release

      - name: Clean up Docker containers
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.override.yml down

  build-and-push-grpc:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [HumanResource, CustomerInfo]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push GRPC Service - ${{ matrix.service }}
        run: |
          SERVICE=${{ matrix.service }}
          SERVICE_LOWER=$(echo $SERVICE | tr '[:upper:]' '[:lower:]')
          IMAGE="$DOCKER_HUB_USERNAME/${SERVICE_LOWER}-grpc"
          docker build -t $IMAGE:$VERSION_TAG -f ./src/Services/$SERVICE/${SERVICE}.Grpc/Dockerfile .
          docker push $IMAGE:$VERSION_TAG

  build-and-push-api:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [Authentication, Inventory, Management, VaccinationReception, FileStorage]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push API Service - ${{ matrix.service }}
        run: |
          SERVICE=${{ matrix.service }}
          SERVICE_LOWER=$(echo $SERVICE | tr '[:upper:]' '[:lower:]')
          IMAGE="$DOCKER_HUB_USERNAME/${SERVICE_LOWER}-service"
          docker build -t $IMAGE:$VERSION_TAG -f ./src/Services/$SERVICE/${SERVICE}.API/Dockerfile .
          docker push $IMAGE:$VERSION_TAG

  build-and-push-workers:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [Email]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Worker - ${{ matrix.worker }}
        run: |
          WORKER=${{ matrix.worker }}
          WORKER_LOWER=$(echo $WORKER | tr '[:upper:]' '[:lower:]')
          IMAGE="$DOCKER_HUB_USERNAME/worker-${WORKER_LOWER}"
          docker build -t $IMAGE:$VERSION_TAG -f ./src/Workers/Workers.${WORKER}/Dockerfile .
          docker push $IMAGE:$VERSION_TAG

  build-and-push-gateways:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gateway: [YarpApiGateWay]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Gateway - ${{ matrix.gateway }}
        run: |
          GATEWAY=${{ matrix.gateway }}
          GATEWAY_LOWER=$(echo $GATEWAY | tr '[:upper:]' '[:lower:]')
          IMAGE="$DOCKER_HUB_USERNAME/$GATEWAY_LOWER"
          docker build -t $IMAGE:$VERSION_TAG -f ./src/ApiGateways/$GATEWAY/Dockerfile .
          docker push $IMAGE:$VERSION_TAG

  deploy:
    needs: 
      - build-and-push-workers
      - build-and-push-grpc
      - build-and-push-api
      - build-and-push-gateways
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm and kubectl
        uses: azure/setup-helm@v3

      - name: Set KUBECONFIG
        run: |
          mkdir -p $HOME/.kube
          printf "%s" "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Helm upgrade
        run: helm upgrade --install $RELEASE_NAME $CHART_DIR -n $NAMESPACE --create-namespace --atomic --wait --set image.tag=${{ env.VERSION_TAG }}

  notify-end:
    needs: [notify-start, build-and-test, build-and-push-workers, build-and-push-grpc, build-and-push-api, build-and-push-gateways, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Calculate duration
        id: duration
        run: |
          start_time=${{ needs.notify-start.outputs.start_time }}
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "mins=$((duration / 60))" >> $GITHUB_OUTPUT
          echo "secs=$((duration % 60))" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            EMOJI="✅"
            MESSAGE="**Success** after ${{ steps.duration.outputs.mins }} min ${{ steps.duration.outputs.secs }} sec"
          else
            EMOJI="❌"
            MESSAGE="**Failed**"
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"$EMOJI **mediflow » mediflow-be - #${{ github.run_number }}** $MESSAGE ([view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
