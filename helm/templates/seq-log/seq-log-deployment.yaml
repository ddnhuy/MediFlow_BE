apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: seq
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
        - name: seq
          image: "datalust/seq:latest"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SEQ_FIRSTRUN_ADMINPASSWORD
              value: "Mediflow@123"
          ports:
            - name: web
              containerPort: 80
            - name: ingestion
              containerPort: 5341